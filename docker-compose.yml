# Quick start for judges:
#   docker compose up --build                 → http://localhost:8000
#   docker compose -f docker-compose.yml -f docker-compose.llm.yml up --build
#                                             → + local LLM explanations (Ollama)
# Put the organisers' kit (CSV/XLSX or data.rar) into ./data before the first start.
services:
  app:
    build:
      context: .
      args:
        REVISION: ${REVISION:-docker}
    image: oilcode:latest
    ports:
      - "${OILCODE_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/data:ro
    environment:
      OILCODE_LLM_BASE_URL: ${OILCODE_LLM_BASE_URL:-}
      OILCODE_LLM_MODEL: ${OILCODE_LLM_MODEL:-}
      OILCODE_LLM_API_KEY: ${OILCODE_LLM_API_KEY:-}
      OILCODE_LLM_TIMEOUT_S: ${OILCODE_LLM_TIMEOUT_S:-60}
    restart: unless-stopped
