name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oilcode-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and run backend checks
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m unittest discover -s tools/modeling -p 'test_*.py' -v

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Copy release
        shell: bash
        run: |
          test -n "$DEPLOY_PATH"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'storage/' \
            --exclude 'frontend/node_modules/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install and restart service
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "export OILCODE_APP_ROOT='$DEPLOY_PATH' OILCODE_PORT=8000 OILCODE_USER='$DEPLOY_USER'; \
             bash '$DEPLOY_PATH/deploy/server/remote_deploy.sh'"

      - name: Verify public health endpoint
        shell: bash
        run: |
          curl --fail --retry 10 --retry-delay 3 "http://$DEPLOY_HOST/api/health"
